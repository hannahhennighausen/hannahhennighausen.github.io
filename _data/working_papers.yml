- drawer: true
  title: "Disaster-Driven Adaptation in the Insurance Market: The Case of Hurricane Sandy"
  pdf: "/Papers/SandyInsurance.pdf"
  abstract: >
    This paper investigates the role of experienced risk in adaptation decisions. I exploit spatial
    variation in flooding to estimate the causal effect of Hurricane Sandy on people's decisions to insure
    against future flood damages. Since the storm, flood insurance demand in flooded areas has continuously
    increased relative to nearby areas that were not flooded. The estimated insurance response was driven by
    the purchase and retention of relatively cheaper policies located in the most flood-damaged areas,
    implying that cost was a critical factor in people's adaptation decisions. Simulated flooding extents of
    six other recent events give evidence that Hurricane Sandy's adaptation response was the exception and
    not the rule.

- drawer: true
  title: "Supply Chain Shocks and Supplier Concentration"
  authors: "with Stefan Borsky"
  abstract: >
    Globalization of production networks means that disasters have impacts far from where they directly
    hit. Localized damage to facilities and infrastructure can slow or shut down production, causing input
    scarcity, price distortions and declines in output and revenue for non-local firms connected through
    the supply chain. This paper tests the hypothesis that diversified trade networks dampen natural
    disaster shocks that propagate through supply chains. We construct two measures of input supplier
    specificity, one on the extensive margin of supplier concentration and another on the intensive margin,
    and find that a diversified supply chain reduces the shock of a natural disaster on both margins.

