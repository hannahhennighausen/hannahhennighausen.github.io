- title: "The Cost of Hurricane Evacuations"
  authors: "with Jacob Gellman, Brett Watson and Kevin Berry"
  abstract: >
    Climate change is increasing the frequency of extreme natural disasters, which threaten human life and
    safety. Evacuation is a key protective action against hurricane danger, but it may be costly for
    individuals. Despite being an important input to emergency management decisions, there is little
    evidence on the size of these costs. We combine spatial data on hurricanes, flooding, and evacuation
    orders with millions of records of individuals' cell phone-derived movement activity to study how
    communities behave during hurricanes. These data generate rich insights about evacuation behavior,
    including differences by physical risk, information provision, and demographics. Using a structural
    travel cost model we estimate that the welfare costs of evacuation can be large when compared to
    mortality costs, averaging a ratio of one to ten but occasionally exceeding the value of statistical
    life lost.

